# ============================================================
# Promote — dev 를 main 으로 올리는 PR 을 만들고 자동 머지를 건다
# ============================================================
# dev 에 커밋이 쌓이면 dev → main PR 을 만든다(이미 열려 있으면 그대로 쓴다). 자동 머지는 main 의 필수 체크가
# 모두 통과한 뒤에 일어난다 — CI 와, 환경 dev 가 그 커밋으로 갱신·스모크를 마치고 붙이는 결과 표지 omk/env-dev
# (scripts/env/README.md 의 "자동 승격"). 표지는 확인한 커밋에 붙으므로 환경이 아직 받지 않은 커밋은 기다린다.
#
# 머지는 일반 머지다(squash 금지) — dev 의 커밋이 main 에 그대로 남아야 release-please 가 버전을 정한다.
#
# 시크릿 OMK_PROMOTE_TOKEN 이 필요하다 — 기본 GITHUB_TOKEN 으로 만든 PR·머지는 다른 워크플로(CI · release-please)를
# 깨우지 않는다. 시크릿이 없으면 아무것도 하지 않고 끝난다(수동 승격 그대로).
name: promote

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.OMK_PROMOTE_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 토큰 확인
        id: token
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::OMK_PROMOTE_TOKEN 이 없어 자동 승격을 건너뜁니다"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: dev → main PR 과 자동 머지
        if: steps.token.outputs.skip != '1'
        run: |
          ahead="$(gh api "repos/$GH_REPO/compare/main...dev" --jq .ahead_by)"
          if [[ "$ahead" -eq 0 ]]; then echo "dev 가 main 보다 앞서 있지 않습니다"; exit 0; fi

          number="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            url="$(gh pr create --base main --head dev --title "release: dev → main" \
              --body "dev 를 main 으로 올린다. 일반 머지 — squash 하지 않는다. CI 와 환경 dev 의 결과 표지(omk/env-dev)가 통과하면 자동으로 머지된다.")"
            number="${url##*/}"
          fi
          echo "PR #$number"

          gh pr merge "$number" --auto --merge \
            || echo "::warning::자동 머지를 걸지 못했습니다 — 저장소 설정의 'Allow auto-merge' 와 main 보호 규칙을 확인하세요"
